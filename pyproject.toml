[project]
name = "koebako"
version = "1.1.2"
description = "Voice-note ingestion and transcription service"
readme = "README.md"
authors = [
    { name = "divin", email = "71128266+divin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.10.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.47",
]

[project.scripts]
koebako-worker = "koebako.services.worker.runner:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
